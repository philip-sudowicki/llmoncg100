name: iOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE_ID=$(python3 .github/scripts/pick_simulator.py)
          echo "Using simulator $DEVICE_ID"
          xcrun simctl list devices available | grep "$DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Lowtide.xcodeproj \
            -scheme Lowtide \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -skip-testing:LowtideUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log

      - name: Fail on compiler warnings
        if: always()
        run: |
          # Compiler, linker and asset catalog diagnostics only (not runtime logs from the test host).
          grep -E '^(/[^ ]*:[0-9]+(:[0-9]+)?: (warning|error): |/[^ ]*: (warning|error): |ld: warning: |warning: |error: )' xcodebuild.log \
            | grep -v "Metadata extraction skipped" \
            | sort -u > issues.txt || true
          cat issues.txt
          if [ -s issues.txt ]; then
            echo "::error::Build produced $(wc -l < issues.txt | tr -d ' ') warnings or errors"
            exit 1
          fi
          echo "No warnings."

  screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Boot an iPhone simulator in central London
        id: sim
        run: |
          DEVICE_ID=$(python3 .github/scripts/pick_simulator.py)
          echo "Using simulator $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl location "$DEVICE_ID" set 51.5074,-0.1278
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Walk through the app and take screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project Lowtide.xcodeproj \
            -scheme Lowtide \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -resultBundlePath screenshots.xcresult \
            -only-testing:LowtideUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui-tests.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path screenshots.xcresult --output-path screenshots
          python3 .github/scripts/name_screenshots.py screenshots
          ls -la screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
