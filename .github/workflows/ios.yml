name: iOS

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Add review snapshots to the test target
        run: cp .github/ci/RenderSnapshots.swift LowtideTests/

      - name: Build and test
        run: |
          mkdir -p snapshots
          xcodebuild test \
            -project Lowtide.xcodeproj \
            -scheme Lowtide \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            TEST_RUNNER_LOWTIDE_SNAPSHOT_DIR="$PWD/snapshots" \
            > build.log 2>&1
          status=$?
          grep -E "error:|warning:|✘|✔ Test run|Test Suite .* (passed|failed)|\*\* (BUILD|TEST)" build.log | sort -u | head -200
          exit $status

      - name: Check for warnings
        if: always()
        run: .github/scripts/check_warnings.sh build.log

      - name: Screenshots
        if: success() || failure()
        continue-on-error: true
        run: |
          app=DerivedData/Build/Products/Debug-iphonesimulator/Lowtide.app
          if [ -d "$app" ]; then .github/scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" "$app" screenshots; fi

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowtide-review
          path: |
            build.log
            screenshots
            snapshots
          if-no-files-found: ignore
          retention-days: 7
